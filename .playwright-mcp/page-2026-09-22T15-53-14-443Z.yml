    - generic [ref=f2e35]:
      - navigation [ref=f2e37]:
        - heading "Contents" [level=3] [ref=f2e38]
        - link "Introduction to big data" [ref=f2e40] [cursor=pointer]:
          - /url: "#introduction-to-big-data"
        - link "The MapReduce Framework" [ref=f2e42] [cursor=pointer]:
          - /url: "#the-mapreduce-framework"
        - link "Apache Spark" [ref=f2e44] [cursor=pointer]:
          - /url: "#apache-spark"
      - paragraph [ref=f2e45]: Bài viết này sẽ cung cấp một cái nhìn tổng quan về phân tích dữ liệu lớn (big data analytics), bao gồm các khái niệm cơ bản, các công nghệ phổ biến và cách chúng được sử dụng để xử lý và phân tích dữ liệu lớn.
      - heading "Introduction to big data" [level=2] [ref=f2e46]
      - paragraph [ref=f2e47]:
        - text: Theo
        - link "IBM" [ref=f2e48] [cursor=pointer]:
          - /url: https://www.ibm.com/think/topics/big-data
        - text: ", dữ liệu lớn (big data) là một tập hợp các dữ liệu có kích thước lớn, tốc độ tăng nhanh và đa dạng, khiến các công cụ phân tích truyền thống không thể xử lý hiệu quả."
      - paragraph [ref=f2e49]: "Dưới đây là 5 chữ V (5 Vs) của dữ liệu lớn, được sử dụng để mô tả các đặc tính của dữ liệu lớn:"
      - heading "Variety of data" [level=3] [ref=f2e50]
      - paragraph [ref=f2e51]: Data có thể đến từ nhiều nguồn dữ liệu khác nhau, như là thời tiết, mạng xã hội, cảm biến IoT, giao dịch tài chính, và nhiều nguồn khác. Dữ liệu có thể ở dạng cấu trúc (structured), bán cấu trúc (semi-structured) hoặc phi cấu trúc (unstructured).
      - heading "Velocity of data" [level=3] [ref=f2e52]
      - paragraph [ref=f2e53]: Data có thể đến từ data warehouse, các file định kỳ hoặc các luồng dữ liệu trực tiếp (streaming data). Dữ liệu có thể được tạo ra với tốc độ cao, ví dụ như dữ liệu từ mạng xã hội hoặc cảm biến IoT. Velocity đề cập đến tốc độ mà dữ liệu được tạo ra và tốc độ mà dữ liệu cần được xử lý và phân tích.
      - heading "Volume of data" [level=3] [ref=f2e54]
      - paragraph [ref=f2e55]: Dữ liệu lớn thường có kích thước rất lớn, từ hàng terabyte đến petabyte hoặc thậm chí exabyte. Volume đề cập đến kích thước của dữ liệu và khả năng lưu trữ và xử lý dữ liệu lớn.
      - heading "Veracity of data" [level=3] [ref=f2e56]
      - paragraph [ref=f2e57]: Dữ liệu lớn có thể chứa nhiều thông tin không chính xác hoặc không đầy đủ. Veracity đề cập đến độ tin cậy và chất lượng của dữ liệu, và việc xử lý dữ liệu lớn đòi hỏi các kỹ thuật để làm sạch và xác thực dữ liệu.
      - heading "Value of data" [level=3] [ref=f2e58]
      - paragraph [ref=f2e59]: Dữ liệu lớn có thể mang lại giá trị lớn nếu được phân tích và sử dụng đúng cách. Value đề cập đến khả năng khai thác giá trị từ dữ liệu lớn thông qua các kỹ thuật phân tích dữ liệu, học máy (machine learning) và trí tuệ nhân tạo (artificial intelligence).
      - heading "The MapReduce Framework" [level=2] [ref=f2e60]
      - paragraph [ref=f2e61]: "MapReduce là một mô hình (framework) được sử dụng để tính toán lượng lớn dữ liệu trong một cụm Hadoop. MapReduces chia quá trình xử lý dữ liệu thành hai bước chính: Map và Reduce. Trong bước Map, dữ liệu được chia thành các cặp key-value và được xử lý song song trên nhiều nút (nodes) trong cụm Hadoop. Trong bước Reduce, các kết quả từ bước Map được tổng hợp lại để tạo ra kết quả cuối cùng."
      - figure [ref=f2e62]:
        - img "MapReduce" [ref=f2e64]
      - heading "Apache Spark" [level=2] [ref=f2e65]
      - paragraph [ref=f2e66]: Apache Spark là một công cụ tính toán phân tán hợp nhất (unified distributed computing engine), được thiết kế để xử lý dữ liệu lớn một cách nhanh chóng và hiệu quả.
      - figure [ref=f2e67]:
        - img "MapReduce" [ref=f2e69]
      - paragraph [ref=f2e70]: Apache Spark là một engine xử lý dữ liệu nhanh chóng trên RAM, giúp tăng tốc độ xử lý dữ liệu lớn so với các công cụ truyền thống như Hadoop MapReduce.
      - paragraph [ref=f2e71]: Spark cung cấp một API dễ sử dụng cho các ngôn ngữ lập trình phổ biến như Java, Scala, Python và R, và hỗ trợ nhiều loại dữ liệu khác nhau, bao gồm dữ liệu cấu trúc, bán cấu trúc và phi cấu trúc. Các thành phần chính của Spark bao gồm Spark Core, Spark SQL, Spark Streaming, MLlib và GraphX. Spark có thể chạy trên nhiều nền tảng khác nhau, bao gồm Hadoop YARN, Apache Mesos và Kubernetes.
      - heading "Spark Architecture" [level=3] [ref=f2e72]
